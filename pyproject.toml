[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_hunter"]

[project]
name = "laya-job-hunter"
version = "3.0.0"
description = "Autonomous Multi-Agent Career & Job Hunting Engine powered by Ollaya/Laya Decision Models and Playwright"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=8.0.0",
]

[project.scripts]
job-hunter = "job_hunter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
